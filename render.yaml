# Render blueprint for Candorify.
# Deploy: push to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo. Render reads this file.
#
# This runs the API + website as one Docker web service.
#
# NOTE ON DATA PERSISTENCE:
# The free tier does NOT support persistent disks, so this blueprint uses an
# ephemeral SQLite database that resets when the service restarts/sleeps. That
# is fine for a prototype/demo (data is synthetic anyway). For durable storage,
# either (a) upgrade the plan and re-add a `disk:` block, or (b) attach a
# managed Postgres and set CANDORIFY_DATABASE_URL accordingly (see docs/DEPLOY.md).

services:
  - type: web
    name: candorify
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CANDORIFY_ENVIRONMENT
        value: production
      - key: CANDORIFY_SECRET_KEY
        generateValue: true
      # Ephemeral SQLite in the container working dir (free tier has no disk).
      - key: CANDORIFY_DATABASE_URL
        value: sqlite:///./candorify.db
      - key: CANDORIFY_UPLOAD_RETENTION_DAYS
        value: "30"
      # Live external services are OFF by default. Flip to false and set the
      # keys below (as secrets in the Render dashboard) to enable them.
      - key: CANDORIFY_TRANSLATION_OFFLINE_ONLY
        value: "true"
      - key: CANDORIFY_BENCHMARK_OFFLINE_ONLY
        value: "true"
      - key: CANDORIFY_PAYMENTS_MOCK_MODE
        value: "true"
      # Set these in the dashboard (Environment) when going live — do NOT commit them:
      # CANDORIFY_LIBRETRANSLATE_API_KEY
      # CANDORIFY_STRIPE_SECRET_KEY
      # CANDORIFY_STRIPE_PUBLISHABLE_KEY
      # CANDORIFY_STRIPE_PRICE_ID_PAID
      # CANDORIFY_STRIPE_WEBHOOK_SECRET
